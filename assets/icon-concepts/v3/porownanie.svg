<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1060" viewBox="0 0 1120 1060"><rect width="1120" height="1060" fill="#111419"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="49" font-size="28" font-weight="600" fill="#fff">EasyShut — dopracowanie opcji 3</text><text x="32" y="82" font-size="17" fill="#bac4d0">Pionowo · ściśnięte S · opuszczona kreska zasilania</text><text x="32" y="111" font-size="15" fill="#9daab9">To samo E i ta sama grubość linii. Kreska w żadnym wariancie nie dotyka S.</text><rect x="32" y="140" width="516" height="435" rx="18" fill="#20242b"/><svg x="126" y="141" width="328" height="328" viewBox="0 0 512 512"><g fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path data-letter="E-contour" d="M 432,296 A 176,176 0 0 1 80,296"/><path data-letter="E-middle-arm" d="M 256,472 L 256,307"/><path data-letter="S" d="M 162.94,118 A 72.38,82 0 1 0 219.2356,251.5402 L 292.7644,148.4598 A 72.38,82 0 1 1 349.06,282"/><path data-part="power-bar" d="M 256,85 L 256,125"/></g></svg><text x="290" y="506" text-anchor="middle" font-size="23" font-weight="600" fill="#fff">A. Delikatne zwężenie</text><text x="290" y="536" text-anchor="middle" font-size="16" fill="#b6c0cd">S węższe o 6%</text><rect x="572" y="140" width="516" height="435" rx="18" fill="#20242b"/><svg x="666" y="141" width="328" height="328" viewBox="0 0 512 512"><g fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path data-letter="E-contour" d="M 432,296 A 176,176 0 0 1 80,296"/><path data-letter="E-middle-arm" d="M 256,472 L 256,307"/><path data-letter="S" d="M 166.9,126.2 A 69.3,77.9 0 1 0 220.8,253.0632 L 291.2,155.1368 A 69.3,77.9 0 1 1 345.1,282"/><path data-part="power-bar" d="M 256,92 L 256,132"/></g></svg><text x="830" y="506" text-anchor="middle" font-size="23" font-weight="600" fill="#fff">B. Lekkie ściśnięcie</text><text x="830" y="536" text-anchor="middle" font-size="16" fill="#b6c0cd">S węższe o 10%, niższe o 5%</text><rect x="32" y="593" width="516" height="435" rx="18" fill="#20242b"/><svg x="126" y="594" width="328" height="328" viewBox="0 0 512 512"><g fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path data-letter="E-contour" d="M 432,296 A 176,176 0 0 1 80,296"/><path data-letter="E-middle-arm" d="M 256,472 L 256,307"/><path data-letter="S" d="M 168.88,134.4 A 67.76,73.8 0 1 0 221.5822,254.5862 L 290.4178,161.8138 A 67.76,73.8 0 1 1 343.12,282"/><path data-part="power-bar" d="M 256,96 L 256,136"/></g></svg><text x="290" y="959" text-anchor="middle" font-size="23" font-weight="600" fill="#fff">C. Bardziej okrągły</text><text x="290" y="989" text-anchor="middle" font-size="16" fill="#b6c0cd">S węższe o 12%, niższe o 10%</text><rect x="572" y="593" width="516" height="435" rx="18" fill="#20242b"/><svg x="666" y="594" width="328" height="328" viewBox="0 0 512 512"><g fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path data-letter="E-contour" d="M 432,296 A 176,176 0 0 1 80,296"/><path data-letter="E-middle-arm" d="M 256,472 L 256,307"/><path data-letter="S" d="M 171.85,140.96 A 65.45,70.52 0 1 0 222.7556,255.8046 L 289.2444,167.1554 A 65.45,70.52 0 1 1 340.15,282"/><path data-part="power-bar" d="M 256,100 L 256,140"/></g></svg><text x="830" y="959" text-anchor="middle" font-size="23" font-weight="600" fill="#fff">D. Najbardziej zwarty</text><text x="830" y="989" text-anchor="middle" font-size="16" fill="#b6c0cd">S węższe o 15%, niższe o 14%</text><text x="32" y="1042" font-size="14" fill="#9daab9">Ciemne tło służy tylko do porównania. Osobne ikony PNG i SVG mają przezroczyste tło.</text></g></svg>