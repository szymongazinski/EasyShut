name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: easyshut-windows
          path: |
            dist/easyshut-1.0.0-windows.zip
            dist/SHA256SUMS.txt
