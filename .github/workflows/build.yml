name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Test installer
        shell: pwsh
        run: ./scripts/installer-test.ps1
      - name: Test single instance and persistent settings
        shell: pwsh
        run: ./scripts/instance-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EasyShut-windows
          path: |
            dist/EasyShut-Setup.exe
            dist/EasyShut-1.2.0-windows.zip
            dist/SHA256SUMS.txt
